<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>RentConnect - Luxury Property Ecosystem</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Cloudflare CDN (Rock solid, no CORS blocks) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      transition: background-color 0.25s ease, color 0.25s ease;
      overscroll-behavior-y: none;
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }
  </style>
</head>
<body class="bg-[#F8F9FA] dark:bg-[#0F1026] text-[#111827] dark:text-white min-h-screen antialiased selection:bg-emerald-500 selection:text-white transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function RentConnectApp() {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [isOwnerView, setIsOwnerView] = useState(false);
      const [activeTab, setActiveTab] = useState('home');
      const [theme, setTheme] = useState(() => localStorage.getItem('rc_theme') || 'light');
      const [toastMessage, setToastMessage] = useState(null);
      const [biometricScanning, setBiometricScanning] = useState(null);

      // Auth Screen State
      const [authMode, setAuthMode] = useState('login'); // 'login' | 'signup'
      const [selectedRole, setSelectedRole] = useState('owner'); // 'owner' | 'tenant'
      const [loginMethod, setLoginMethod] = useState('biometric'); // 'biometric' | 'phone' | 'email'

      // Sign Up Inputs
      const [regName, setRegName] = useState('');
      const [regPhone, setRegPhone] = useState('');
      const [regEmail, setRegEmail] = useState('');
      const [regNid, setRegNid] = useState('');
      const [regBuilding, setRegBuilding] = useState('Gulshan Luxury Tower');
      const [regUnit, setRegUnit] = useState('2B');

      // Backend State Simulation
      const [rentCollected, setRentCollected] = useState(85000);
      const rentTotal = 142000;
      const [gasAlertActive, setGasAlertActive] = useState(true);
      const [waterAlertActive, setWaterAlertActive] = useState(true);
      const [rooftopLocked, setRooftopLocked] = useState(true);

      // Modals
      const [showPayModal, setShowPayModal] = useState(false);
      const [showContractModal, setShowContractModal] = useState(false);
      const [selectedReceipt, setSelectedReceipt] = useState(null);
      const [diagnosisUnit, setDiagnosisUnit] = useState(null);

      useEffect(() => {
        try { localStorage.setItem('rc_theme', theme); } catch(e){}
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
        }
      }, [theme]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      const handleLoginSuccess = (role, method = 'biometric') => {
        setBiometricScanning(`${role}-${method}`);
        setTimeout(() => {
          setBiometricScanning(null);
          setIsOwnerView(role === 'owner');
          setIsLoggedIn(true);
          setActiveTab('home');
          showToast(role === 'owner' ? "Welcome back, Md ABID HASAN SIFAT! Owner Command Center loaded." : "Welcome back, Tanvir Ahmed! Resident Sanctuary loaded.");
        }, 700);
      };

      const handleSignUpSuccess = (e) => {
        e.preventDefault();
        setBiometricScanning(`${selectedRole}-signup`);
        setTimeout(() => {
          setBiometricScanning(null);
          setIsOwnerView(selectedRole === 'owner');
          setIsLoggedIn(true);
          setActiveTab('home');
          showToast(`Account registered successfully for ${regName || (selectedRole === 'owner' ? 'Md ABID HASAN SIFAT' : 'Tanvir Ahmed')}!`);
        }, 800);
      };

      const handlePayRentSuccess = () => {
        setRentCollected(prev => Math.min(rentTotal, prev + 28000));
        setShowPayModal(false);
        showToast("Rent ৳28,000 paid via bKash! TxID: BK9X" + Math.floor(100000 + Math.random()*900000));
      };

      // 1. SPLASH / AUTH VIEW
      if (!isLoggedIn) {
        return (
          <div className="min-h-screen bg-[#F8F9FA] dark:bg-[#0F1026] text-[#111827] dark:text-white flex flex-col justify-between items-center px-4 py-6 sm:py-10 selection:bg-emerald-500 font-sans animate-fade-in relative overflow-hidden transition-colors duration-300">
            
            <div className="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div className="absolute bottom-1/4 left-1/2 -translate-x-1/2 w-80 h-80 bg-indigo-600/10 dark:bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>

            {/* Top Bar with Theme Toggle */}
            <div className="w-full max-w-md flex items-center justify-between z-20">
              <span className="text-xs text-slate-500 dark:text-slate-400 font-bold flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-emerald-500"></span> Secured Gateway</span>
              <div className="flex items-center bg-white dark:bg-[#1A1D3D] p-1 rounded-2xl border border-slate-200 dark:border-slate-700/50 shadow-sm">
                <button type="button" onClick={() => setTheme('light')} className={`px-2.5 py-1 rounded-xl text-xs font-black transition-all ${theme === 'light' ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-400'}`}>☀️ Light</button>
                <button type="button" onClick={() => setTheme('dark')} className={`px-2.5 py-1 rounded-xl text-xs font-black transition-all ${theme === 'dark' ? 'bg-[#2B2F5C] text-white shadow-sm' : 'text-slate-400'}`}>🌙 Dark</button>
              </div>
            </div>

            {/* Top Branding Section */}
            <div className="flex flex-col items-center text-center pt-2 z-10">
              <div className="w-14 h-14 sm:w-16 sm:h-16 rounded-3xl bg-white dark:bg-[#1A1D3D] border border-slate-200 dark:border-slate-700/50 flex items-center justify-center shadow-lg dark:shadow-2xl mb-2 text-[#111827] dark:text-white">
                <svg className="w-8 h-8 stroke-current fill-none stroke-2" viewBox="0 0 24 24">
                  <rect x="4" y="2" width="16" height="20" rx="3"/><path d="M9 6h6M9 10h6M9 14h6M9 18h6"/><rect x="8" y="2" width="8" height="4" rx="1"/>
                </svg>
              </div>
              <h1 className="text-xl sm:text-2xl font-black tracking-[0.25em] text-[#111827] dark:text-white uppercase">RENT</h1>
              <h2 className="text-lg sm:text-xl font-black tracking-[0.3em] text-[#00B665] uppercase mt-0.5">CONNECT</h2>
            </div>

            {/* Center Auth Container */}
            <div className="w-full max-w-md my-4 z-10 space-y-3.5">
              
              {/* Mode Switcher: Sign In vs Sign Up */}
              <div className="p-1 rounded-2xl bg-white dark:bg-[#1A1D3D] border border-slate-200 dark:border-slate-700/60 flex items-center shadow-sm">
                <button type="button" onClick={() => setAuthMode('login')} className={`flex-1 py-2.5 rounded-xl text-xs font-black transition-all flex items-center justify-center gap-1.5 ${authMode === 'login' ? 'bg-slate-900 text-white dark:bg-[#2B2F5C] dark:text-white shadow-sm' : 'text-slate-500 hover:text-slate-900 dark:text-slate-400'}`}>
                  <span>🔑</span><span>Sign In (Log In)</span>
                </button>
                <button type="button" onClick={() => setAuthMode('signup')} className={`flex-1 py-2.5 rounded-xl text-xs font-black transition-all flex items-center justify-center gap-1.5 ${authMode === 'signup' ? 'bg-[#00B665] text-white shadow-sm' : 'text-slate-500 hover:text-slate-900 dark:text-slate-400'}`}>
                  <span>📝</span><span>Sign Up (Register)</span>
                </button>
              </div>

              {/* Role Switcher */}
              <div className="grid grid-cols-2 gap-2">
                <button type="button" onClick={() => setSelectedRole('owner')} className={`p-3 rounded-2xl border text-center transition-all flex items-center justify-center gap-2 ${selectedRole === 'owner' ? 'border-amber-500 bg-amber-50 dark:bg-amber-500/15 text-slate-900 dark:text-white ring-2 ring-amber-500/40 shadow-sm' : 'border-slate-200 dark:border-slate-700/50 bg-white dark:bg-[#1D2040]/70 text-slate-600 dark:text-slate-400'}`}>
                  <span className="text-xl">🏛️</span>
                  <div className="text-left"><span className="font-extrabold text-xs block leading-tight text-[#111827] dark:text-white">House Owner</span><span className="text-[10px] text-slate-500 dark:text-slate-400">Landlord Portfolio</span></div>
                </button>
                <button type="button" onClick={() => setSelectedRole('tenant')} className={`p-3 rounded-2xl border text-center transition-all flex items-center justify-center gap-2 ${selectedRole === 'tenant' ? 'border-emerald-500 bg-emerald-50 dark:bg-emerald-500/15 text-slate-900 dark:text-white ring-2 ring-emerald-500/40 shadow-sm' : 'border-slate-200 dark:border-slate-700/50 bg-white dark:bg-[#1D2040]/70 text-slate-600 dark:text-slate-400'}`}>
                  <span className="text-xl">🏠</span>
                  <div className="text-left"><span className="font-extrabold text-xs block leading-tight text-[#111827] dark:text-white">Resident Tenant</span><span className="text-[10px] text-slate-500 dark:text-slate-400">Flat Resident</span></div>
                </button>
              </div>

              {/* --- LOG IN FLOW --- */}
              {authMode === 'login' && (
                <div className="space-y-3">
                  <div className="flex items-center justify-between p-1 rounded-xl bg-white dark:bg-[#1A1D3D] border border-slate-200 dark:border-slate-700/40 text-[11px] font-bold shadow-sm">
                    <button type="button" onClick={() => setLoginMethod('biometric')} className={`flex-1 py-1 rounded-lg ${loginMethod === 'biometric' ? 'bg-slate-900 text-white dark:bg-[#2B2F5C]' : 'text-slate-500 dark:text-slate-400'}`}>Biometric</button>
                    <button type="button" onClick={() => setLoginMethod('phone')} className={`flex-1 py-1 rounded-lg ${loginMethod === 'phone' ? 'bg-slate-900 text-white dark:bg-[#2B2F5C]' : 'text-slate-500 dark:text-slate-400'}`}>Phone OTP</button>
                    <button type="button" onClick={() => setLoginMethod('email')} className={`flex-1 py-1 rounded-lg ${loginMethod === 'email' ? 'bg-slate-900 text-white dark:bg-[#2B2F5C]' : 'text-slate-500 dark:text-slate-400'}`}>Email</button>
                  </div>

                  {loginMethod === 'biometric' && (
                    <div className="rounded-[28px] p-5 sm:p-6 bg-white dark:bg-[#1D2040]/90 border border-slate-200 dark:border-slate-700/40 shadow-xl space-y-4">
                      <div onClick={() => handleLoginSuccess(selectedRole, '1click')} className="flex items-center gap-4 cursor-pointer">
                        <div className="w-12 h-12 rounded-2xl bg-slate-100 dark:bg-[#2B2F5C] text-[#111827] dark:text-white flex items-center justify-center shrink-0 shadow-inner">
                          {selectedRole === 'owner' ? '🏛️' : '🏠'}
                        </div>
                        <div className="flex-1 text-left">
                          <h3 className="font-extrabold text-base text-[#111827] dark:text-white">Join as {selectedRole === 'owner' ? 'House Owner' : 'Tenant'}</h3>
                          <p className="text-xs text-slate-500 dark:text-slate-400">{selectedRole === 'owner' ? 'Manage your property' : 'Access your residence'}</p>
                        </div>
                      </div>
                      <div className="grid grid-cols-2 gap-2.5 pt-1">
                        <button type="button" onClick={() => handleLoginSuccess(selectedRole, 'face')} className="py-2.5 px-3 rounded-2xl bg-slate-50 hover:bg-slate-100 dark:bg-[#2B2F5C]/80 dark:hover:bg-[#383D75] text-xs font-bold text-slate-800 dark:text-slate-200 flex items-center justify-center gap-2 border border-slate-200 dark:border-slate-600/40">
                          <span className="text-[#00B665]">⛶</span><span>Face ID</span>
                        </button>
                        <button type="button" onClick={() => handleLoginSuccess(selectedRole, 'touch')} className="py-2.5 px-3 rounded-2xl bg-slate-50 hover:bg-slate-100 dark:bg-[#2B2F5C]/80 dark:hover:bg-[#383D75] text-xs font-bold text-slate-800 dark:text-slate-200 flex items-center justify-center gap-2 border border-slate-200 dark:border-slate-600/40">
                          <span className="text-[#00B665]">🪪</span><span>Touch ID</span>
                        </button>
                      </div>
                    </div>
                  )}

                  {loginMethod === 'phone' && (
                    <form onSubmit={(e) => { e.preventDefault(); handleLoginSuccess(selectedRole, 'phone'); }} className="rounded-[28px] p-5 bg-white dark:bg-[#1D2040]/90 border border-slate-200 dark:border-slate-700/40 space-y-3 shadow-xl">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Bangladeshi Phone (+880)</label>
                        <input type="tel" defaultValue="+880 1711-234567" className="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-[#0D1117] border border-slate-200 dark:border-slate-700 text-sm font-mono text-[#111827] dark:text-white focus:outline-none" />
                      </div>
                      <button type="submit" className="w-full py-3.5 bg-[#00B665] text-white font-extrabold text-xs rounded-2xl shadow">Log In with OTP →</button>
                    </form>
                  )}

                  {loginMethod === 'email' && (
                    <form onSubmit={(e) => { e.preventDefault(); handleLoginSuccess(selectedRole, 'email'); }} className="rounded-[28px] p-5 bg-white dark:bg-[#1D2040]/90 border border-slate-200 dark:border-slate-700/40 space-y-3 shadow-xl">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Email</label>
                        <input type="email" defaultValue="user@gulshantower.com" className="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-[#0D1117] border border-slate-200 dark:border-slate-700 text-sm font-mono text-[#111827] dark:text-white focus:outline-none" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">Password</label>
                        <input type="password" defaultValue="••••••••" className="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-[#0D1117] border border-slate-200 dark:border-slate-700 text-sm font-mono text-[#111827] dark:text-white focus:outline-none" />
                      </div>
                      <button type="submit" className="w-full py-3.5 bg-[#00B665] text-white font-extrabold text-xs rounded-2xl shadow">Log In as {selectedRole === 'owner' ? 'Owner' : 'Tenant'} →</button>
                    </form>
                  )}
                </div>
              )}

              {/* --- SIGN UP FLOW --- */}
              {authMode === 'signup' && (
                <form onSubmit={handleSignUpSuccess} className="rounded-[28px] p-5 bg-white dark:bg-[#1D2040]/90 border border-slate-200 dark:border-slate-700/40 space-y-2.5 max-h-[55vh] overflow-y-auto shadow-xl">
                  <h3 className="font-extrabold text-sm text-[#111827] dark:text-white border-b border-slate-200 dark:border-slate-700/60 pb-1.5">Sign Up as {selectedRole === 'owner' ? 'House Owner' : 'Resident Tenant'}</h3>
                  <div>
                    <label className="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-0.5">Full Name</label>
                    <input type="text" required value={regName} onChange={e=>setRegName(e.target.value)} placeholder={selectedRole === 'owner' ? 'Md ABID HASAN SIFAT' : 'Tanvir Ahmed'} className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#0D1117] border border-slate-200 dark:border-slate-700 text-xs text-[#111827] dark:text-white" />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-0.5">Mobile Phone</label>
                      <input type="tel" required value={regPhone} onChange={e=>setRegPhone(e.target.value)} placeholder="+880 1711-XXXXXX" className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#0D1117] border border-slate-200 dark:border-slate-700 text-xs text-[#111827] dark:text-white font-mono" />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-0.5">National ID (NID)</label>
                      <input type="text" required value={regNid} onChange={e=>setRegNid(e.target.value)} placeholder="1988269..." className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#0D1117] border border-slate-200 dark:border-slate-700 text-xs text-[#111827] dark:text-white font-mono" />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-0.5">Building Name</label>
                      <input type="text" required value={regBuilding} onChange={e=>setRegBuilding(e.target.value)} className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#0D1117] border border-slate-200 dark:border-slate-700 text-xs text-[#111827] dark:text-white" />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-0.5">{selectedRole === 'owner' ? 'Total Units' : 'Flat Number'}</label>
                      <input type="text" required defaultValue={selectedRole === 'owner' ? '9 Units' : 'Flat 2B'} className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-[#0D1117] border border-slate-200 dark:border-slate-700 text-xs text-[#111827] dark:text-white font-mono" />
                    </div>
                  </div>
                  <button type="submit" className="w-full py-3 bg-[#00B665] text-white font-black text-xs rounded-2xl shadow mt-1">Complete Registration →</button>
                </form>
              )}

            </div>

            {/* Footer */}
            <div className="text-center space-y-1 pb-2 z-10">
              <p className="text-[11px] font-black uppercase tracking-[0.2em] text-slate-500 dark:text-slate-400">DHAKA LUXURY MARKET</p>
              <p className="text-[10px] text-slate-500">Secured by biometric authentication & End To End Encryption</p>
            </div>

            {biometricScanning && (
              <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex flex-col items-center justify-center space-y-4 animate-fade-in">
                <div className="w-20 h-20 rounded-full border-4 border-emerald-500/30 border-t-emerald-500 animate-spin flex items-center justify-center">
                  <span className="text-2xl animate-pulse">✨</span>
                </div>
                <div className="text-center">
                  <h4 className="font-extrabold text-sm text-white">Authenticating Credentials...</h4>
                  <p className="text-xs text-slate-300 mt-0.5">Encrypted Dhaka Resident Handshake</p>
                </div>
              </div>
            )}

          </div>
        );
      }

      // 2. MAIN APP
      const rentPercent = Math.round((rentCollected / rentTotal) * 100);
      const rentOffset = 251.2 - (251.2 * rentPercent) / 100;

      return (
        <div className="min-h-screen bg-[#F8F9FA] dark:bg-[#0B0E14] text-[#111827] dark:text-white flex flex-col justify-between transition-colors duration-300">
          
          {toastMessage && (
            <div className="fixed top-4 left-4 right-4 z-50 max-w-sm mx-auto bg-[#121632] text-white px-4 py-3 rounded-2xl shadow-2xl border border-emerald-500/40 flex items-center gap-3 animate-bounce">
              <span className="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
              <span className="text-xs font-bold">{toastMessage}</span>
            </div>
          )}

          {/* Top Header */}
          <header className="sticky top-0 z-40 bg-white/95 dark:bg-[#161B22]/95 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800 px-3.5 sm:px-6 py-2">
            <div className="max-w-md sm:max-w-4xl mx-auto flex items-center justify-between gap-2">
              <div className="flex items-center gap-2">
                <div onClick={() => setActiveTab('home')} className="flex items-center gap-2 cursor-pointer select-none">
                  <div className="w-8 h-8 rounded-xl bg-gradient-to-br from-[#121632] to-[#00B665] flex items-center justify-center text-white font-black text-sm shadow">RC</div>
                  <span className="font-black text-base tracking-tight text-[#111827] dark:text-white">RentConnect</span>
                </div>

                <button
                  onClick={() => {
                    setIsOwnerView(!isOwnerView);
                    setActiveTab('home');
                    showToast(isOwnerView ? "Switched to Resident Tenant Mode" : "Switched to House Owner Command Center");
                  }}
                  className={`px-2.5 py-1 rounded-full text-[10px] font-black border transition-all active:scale-95 flex items-center gap-1 ${
                    isOwnerView
                      ? 'bg-amber-500/15 text-amber-600 dark:text-amber-400 border-amber-500/30'
                      : 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border-emerald-500/30'
                  }`}>
                  <span>{isOwnerView ? '👑 Owner' : '🛡️ Tenant'}</span>
                  <span className="text-[9px] opacity-70 underline">switch</span>
                </button>
              </div>

              <div className="flex items-center gap-2">
                <div className="flex items-center bg-slate-100 dark:bg-slate-800 p-0.5 rounded-xl border border-slate-200 dark:border-slate-700">
                  <button type="button" onClick={() => setTheme('light')} className={`px-2 py-1 rounded-lg text-xs font-bold ${theme === 'light' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-400'}`}>☀️</button>
                  <button type="button" onClick={() => setTheme('dark')} className={`px-2 py-1 rounded-lg text-xs font-bold ${theme === 'dark' ? 'bg-[#161B22] text-white shadow-sm' : 'text-slate-400'}`}>🌙</button>
                </div>

                <button onClick={() => setIsLoggedIn(false)} className="px-2.5 py-1.5 rounded-xl text-xs font-extrabold bg-red-500/10 hover:bg-red-500/20 text-red-600 dark:text-red-400 border border-red-500/20 flex items-center gap-1 active:scale-95">
                  <span>🚪</span><span className="hidden sm:inline">Log Out</span>

                        <div className="p-3 rounded-2xl bg-slate-50 dark:bg-slate-900"><span className="text-[10px] text-slate-400">Assigned Flat</span><div className="font-black text-sm">Flat 2B (Floor 2)</div></div>
                        <div className="p-3 rounded-2xl bg-slate-50 dark:bg-slate-900"><span className="text-[10px] text-slate-400">Parking Slot</span><div className="font-black text-sm">Slot P-14</div></div>
                        <div className="p-3 rounded-2xl bg-slate-50 dark:bg-slate-900"><span className="text-[10px] text-slate-400">Monthly Rent</span><div className="font-black text-emerald-600 text-sm">৳28,000 / mo</div></div>
                        <div className="p-3 rounded-2xl bg-slate-50 dark:bg-slate-900"><span className="text-[10px] text-slate-400">Security Escrow</span><div className="font-black text-slate-800 dark:text-white text-sm">৳56,000</div></div>
                      </div>
                    </div>

                    <button onClick={() => setIsLoggedIn(false)} className="w-full py-3.5 rounded-2xl bg-red-500/10 text-red-600 font-bold text-xs uppercase border border-red-500/20">🚪 Log Out of RentConnect</button>
                  </div>
                )}
              </>
            )}

          </main>

          {/* Bottom Nav */}
          {isOwnerView ? (
            <nav className="fixed bottom-0 left-0 right-0 z-40 bg-white/95 dark:bg-[#161B22]/95 backdrop-blur-xl border-t border-slate-200/80 dark:border-slate-800 pb-safe pt-1.5 px-3 shadow-lg">
              <div className="max-w-md mx-auto flex items-center justify-around">
                <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center py-1.5 px-3 rounded-2xl ${activeTab === 'home' ? 'text-[#111827] dark:text-white font-extrabold scale-105' : 'text-slate-400'}`}><span className="text-xl">📈</span><span className="text-[11px] font-bold">Home</span></button>
                <button onClick={() => setActiveTab('vault')} className={`flex flex-col items-center py-1.5 px-3 rounded-2xl ${activeTab === 'vault' ? 'text-[#111827] dark:text-white font-extrabold scale-105' : 'text-slate-400'}`}><span className="text-xl">🛡️</span><span className="text-[11px] font-bold">Vault</span></button>
                <button onClick={() => setActiveTab('monitor')} className={`flex flex-col items-center py-1.5 px-3 rounded-2xl ${activeTab === 'monitor' ? 'text-[#111827] dark:text-white font-extrabold scale-105' : 'text-slate-400'}`}><span className="text-xl">📊</span><span className="text-[11px] font-bold">Monitor</span></button>
                <button onClick={() => setActiveTab('security')} className={`flex flex-col items-center py-1.5 px-3 rounded-2xl ${activeTab === 'security' ? 'text-[#111827] dark:text-white font-extrabold scale-105' : 'text-slate-400'}`}><span className="text-xl">🛡️</span><span className="text-[11px] font-bold">Security</span></button>
                <button onClick={() => setActiveTab('profile')} className={`flex flex-col items-center py-1.5 px-3 rounded-2xl ${activeTab === 'profile' ? 'text-[#111827] dark:text-white font-extrabold scale-105' : 'text-slate-400'}`}><span className="text-xl">👤</span><span className="text-[11px] font-bold">Profile</span></button>
              </div>
            </nav>
          ) : (
            <nav className="fixed bottom-0 left-0 right-0 z-40 bg-white/95 dark:bg-[#161B22]/95 backdrop-blur-xl border-t border-slate-200/80 dark:border-slate-800 pb-safe pt-1.5 px-3 shadow-lg">
              <div className="max-w-md mx-auto flex items-center justify-around">
                <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center py-1.5 px-2 rounded-2xl ${activeTab === 'home' ? 'text-[#111827] dark:text-white font-extrabold scale-105' : 'text-slate-400'}`}><span className="text-xl">🏠</span><span className="text-[11px] font-bold">Home</span></button>
                <button onClick={() => setActiveTab('lease')} className={`flex flex-col items-center py-1.5 px-2 rounded-2xl ${activeTab === 'lease' ? 'text-[#111827] dark:text-white font-extrabold scale-105' : 'text-slate-400'}`}><span className="text-xl">📄</span><span className="text-[11px] font-bold">Lease</span></button>
                <button onClick={() => setActiveTab('pay')} className={`flex flex-col items-center py-1.5 px-2 rounded-2xl ${activeTab === 'pay' ? 'text-[#00B665] font-extrabold scale-105' : 'text-slate-400'}`}><span className="text-xl">💲</span><span className="text-[11px] font-bold">Pay</span></button>
                <button onClick={() => setActiveTab('chat')} className={`flex flex-col items-center py-1.5 px-2 rounded-2xl ${activeTab === 'chat' ? 'text-sky-500 font-extrabold scale-105' : 'text-slate-400'}`}><span className="text-xl">💬</span><span className="text-[11px] font-bold">Chat</span></button>
                <button onClick={() => setActiveTab('guests')} className={`flex flex-col items-center py-1.5 px-2 rounded-2xl ${activeTab === 'guests' ? 'text-[#111827] dark:text-white font-extrabold scale-105' : 'text-slate-400'}`}><span className="text-xl">👥</span><span className="text-[11px] font-bold">Guests</span></button>
                <button onClick={() => setActiveTab('profile')} className={`flex flex-col items-center py-1.5 px-2 rounded-2xl ${activeTab === 'profile' ? 'text-[#111827] dark:text-white font-extrabold scale-105' : 'text-slate-400'}`}><span className="text-xl">👤</span><span className="text-[11px] font-bold">Profile</span></button>
              </div>
            </nav>
          )}

          {/* Pay Modal */}
          {showPayModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="w-full max-w-sm bg-white dark:bg-[#161B22] p-6 rounded-3xl space-y-4 border border-slate-200 dark:border-slate-800">
                <h3 className="font-extrabold text-base">bKash Rent Checkout</h3>
                <div className="p-3 bg-slate-50 dark:bg-slate-900 rounded-2xl text-xs space-y-1">
                  <div className="flex justify-between"><span>Unit Rent (Flat 2B):</span><strong>৳ 28,000</strong></div>
                  <div className="flex justify-between"><span>Building Service:</span><strong>৳ 3,500</strong></div>
                </div>
                <button onClick={handlePayRentSuccess} className="w-full py-3.5 bg-[#00B665] text-white font-black rounded-2xl">Confirm ৳31,500 Payment →</button>
                <button onClick={() => setShowPayModal(false)} className="w-full py-2 text-xs font-bold text-slate-400">Cancel</button>
              </div>
            </div>
          )}

          {/* Receipt Slip Modal */}
          {selectedReceipt && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="w-full max-w-sm bg-white dark:bg-[#161B22] p-6 rounded-3xl space-y-4 border border-slate-200 dark:border-slate-800">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-extrabold text-sm">Official Rent Receipt</h3>
                  <button onClick={() => setSelectedReceipt(null)} className="font-bold">✕</button>
                </div>
                <div className="p-4 bg-slate-50 dark:bg-slate-900 rounded-2xl text-xs space-y-2">
                  <div className="flex justify-between"><span>Receipt ID:</span><strong className="font-mono">{selectedReceipt.id}</strong></div>
                  <div className="flex justify-between"><span>Tenant:</span><strong>{selectedReceipt.tenant}</strong></div>
                  <div className="flex justify-between"><span>Unit:</span><strong className="text-emerald-600 font-bold">Flat {selectedReceipt.unit}</strong></div>
                  <div className="flex justify-between"><span>Amount Paid:</span><strong className="font-mono text-base font-black text-emerald-600">৳{selectedReceipt.amount.toLocaleString()}</strong></div>
                </div>
                <button onClick={() => window.print()} className="w-full py-3 bg-[#121632] text-white font-bold text-xs rounded-2xl">🖨️ Print Receipt Slip</button>
              </div>
            </div>
          )}

          {/* Diagnosis Modal */}
          {diagnosisUnit && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="w-full max-w-sm bg-white dark:bg-[#161B22] p-6 rounded-3xl space-y-4 border border-slate-200 dark:border-slate-800">
                <h3 className="font-extrabold text-base">Water Telemetry Diagnosis</h3>
                <div className="p-3 bg-red-50 dark:bg-red-950/30 text-xs rounded-2xl space-y-1">
                  <div className="flex justify-between"><span>Affected Unit:</span><strong>Flat {diagnosisUnit}</strong></div>
                  <div className="flex justify-between"><span>Flow Rate:</span><strong className="text-red-600 font-bold">420 L/day (↑235%)</strong></div>
                </div>
                <button onClick={() => { setWaterAlertActive(false); setDiagnosisUnit(null); showToast("Emergency plumber dispatched to Flat 1B!"); }} className="w-full py-3.5 bg-[#00B665] text-white font-bold text-xs rounded-2xl">🔧 Dispatch Emergency Plumber →</button>
                <button onClick={() => setDiagnosisUnit(null)} className="w-full py-2 text-xs font-bold text-slate-400">Cancel</button>
              </div>
            </div>
          )}

          {/* Contract Modal */}
          {showContractModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="w-full max-w-md bg-white dark:bg-[#161B22] p-6 rounded-3xl space-y-4 border border-slate-200 dark:border-slate-800">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="font-extrabold text-base">Signed Tenancy Agreement</h3>
                  <button onClick={() => setShowContractModal(false)} className="font-bold">✕</button>
                </div>
                <p className="text-xs text-slate-500">Premises: Gulshan Luxury Tower, Flat 2B. Landlord: Md ABID HASAN SIFAT. Tenant: Tanvir Ahmed.</p>
                <button onClick={() => window.print()} className="w-full py-3 bg-[#00B665] text-white font-bold text-xs rounded-2xl">⬇️ Download / Print Signed PDF</button>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<RentConnectApp />);
  </script>
</body>
</html>
